name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Godot und Export-Vorlagen installieren
        run: |
          set -e
          mkdir -p ~/godot-cache && cd ~/godot-cache
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -f godot ]; then
            wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
            rm -f *.zip
          fi
          if [ ! -d templates ]; then
            wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            rm -f *.tpz
            # Nur behalten, was gebraucht wird
            find templates -type f ! -name 'linux_*' ! -name 'windows_*' ! -name 'android_debug.apk' ! -name 'android_release.apk' ! -name 'version.txt' -delete
          fi
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          sudo ln -sf ~/godot-cache/godot /usr/local/bin/godot
          godot --version

      - name: Android-Werkzeuge einrichten
        run: |
          set -e
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres "editor_settings-${MINOR}.tres"; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

      - name: Projekt importieren
        run: godot --headless --path . --import || true

      - name: Automatischer Spieltest
        run: |
          godot --headless --path . -- --autotest 2>&1 | tee autotest.log
          grep -q "AUTOTEST BESTANDEN" autotest.log

      - name: Exportieren
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          mkdir -p build/windows build/linux build/android dist
          godot --headless --path . --export-release "Windows" build/windows/FantasyPixelgame.exe
          godot --headless --path . --export-release "Linux" build/linux/FantasyPixelgame.x86_64
          godot --headless --path . --export-debug "Android" build/android/FantasyPixelgame.apk
          ls -la build/*
          test -f build/windows/FantasyPixelgame.exe
          test -f build/linux/FantasyPixelgame.x86_64
          test -f build/android/FantasyPixelgame.apk
          (cd build/windows && zip -q ../../dist/FantasyPixelgame-Windows.zip FantasyPixelgame.exe)
          chmod +x build/linux/FantasyPixelgame.x86_64
          (cd build/linux && tar -czf ../../dist/FantasyPixelgame-Linux.tar.gz FantasyPixelgame.x86_64)
          cp build/android/FantasyPixelgame.apk dist/FantasyPixelgame-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FantasyPixelgame
          path: dist/*

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
